services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: classicguess
      POSTGRES_PASSWORD: classicguess
      POSTGRES_DB: classicguess
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classicguess -d classicguess"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
