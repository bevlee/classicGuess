apiVersion: apps/v1
kind: Deployment
metadata:
  name: classicguess
  namespace: classicguess
  labels:
    app: classicguess
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: classicguess
  template:
    metadata:
      labels:
        app: classicguess
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: docker.io/bevdev1/classicguess
          command: ["node", "scripts/migrate.mjs"]
          envFrom:
            - secretRef:
                name: classicguess-app
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: classicguess
          # Bare artifact name so Skaffold rewrites it to the tag it builds.
          image: docker.io/bevdev1/classicguess
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: classicguess-app
          env:
            - name: ORIGIN
              value: https://classicguess.bevsoft.com
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health?ready=1
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            # Writable scratch space under a read-only root for Node temporary files.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
