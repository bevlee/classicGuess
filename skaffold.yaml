apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: classicguess
build:
  platforms: ["linux/arm64"]
  local:
    push: true
  # `git describe --tags`: v0.2.0 on a tagged commit, v0.2.0-3-gabc1234 three
  # commits later, with -dirty for uncommitted changes.
  tagPolicy:
    gitCommit:
      variant: Tags
  artifacts:
    - image: docker.io/bevdev1/classicguess
      docker:
        dockerfile: Dockerfile
deploy:
  kubectl:
    defaultNamespace: classicguess
manifests:
  kustomize:
    paths:
      - k8s
